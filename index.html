<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuestas Enfoque — Demo del Sistema</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0f0f0f;
    --ink2: #3a3a3a;
    --ink3: #888;
    --paper: #fafaf8;
    --surface: #f2f1ee;
    --surface2: #e8e6e1;
    --accent: #1a472a;
    --accent2: #2d6a4f;
    --accent-light: #d8f3dc;
    --gold: #b5870a;
    --gold-light: #fef9e7;
    --danger: #c0392b;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --r: 10px;
    --r2: 16px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }
  h1,h2,h3,h4 { font-family: 'Syne', sans-serif; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(250,250,248,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; gap: 0; height: 56px;
  }
  .nav-brand {
    font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: 16px;
    color: var(--accent);
    margin-right: auto;
    letter-spacing: -0.3px;
  }
  .nav-brand span { color: var(--ink3); font-weight: 400; }
  .nav-tabs { display: flex; gap: 2px; }
  .nav-tab {
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--ink3);
    border: none; background: none; transition: all .15s;
    font-family: 'DM Sans', sans-serif;
  }
  .nav-tab:hover { background: var(--surface); color: var(--ink); }
  .nav-tab.active { background: var(--accent); color: #fff; }

  /* SECTIONS */
  .section { min-height: 100vh; padding: 80px 0 60px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }

  /* HERO */
  .hero { background: var(--paper); padding: 120px 0 80px; min-height: unset; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent-light); color: var(--accent2);
    font-size: 12px; font-weight: 600; letter-spacing: .5px;
    padding: 4px 12px; border-radius: 100px;
    text-transform: uppercase; margin-bottom: 24px;
  }
  .hero-eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); }
  .hero h1 {
    font-size: clamp(36px, 5vw, 64px); font-weight: 800;
    line-height: 1.08; letter-spacing: -2px; color: var(--ink);
    max-width: 700px; margin-bottom: 24px;
  }
  .hero h1 em { color: var(--accent2); font-style: normal; }
  .hero-sub {
    font-size: 18px; color: var(--ink2); max-width: 520px;
    line-height: 1.6; margin-bottom: 40px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 24px; border-radius: var(--r); font-size: 14px;
    font-weight: 600; cursor: pointer; border: none; transition: all .15s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-outline { background: transparent; color: var(--ink); border: 1.5px solid var(--border2); }
  .btn-outline:hover { background: var(--surface); }
  .hero-btns { display: flex; gap: 12px; flex-wrap: wrap; }

  /* STATS ROW */
  .stats-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--border); border: 1px solid var(--border);
    border-radius: var(--r2); overflow: hidden; margin-top: 64px;
  }
  .stat-box {
    background: var(--paper); padding: 28px 24px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-box .num {
    font-family: 'Syne', sans-serif; font-size: 32px;
    font-weight: 800; color: var(--accent); letter-spacing: -1px;
  }
  .stat-box .label { font-size: 13px; color: var(--ink3); }

  /* SECTION TITLES */
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent2);
    margin-bottom: 12px;
  }
  .section-title {
    font-size: clamp(28px, 3.5vw, 44px); font-weight: 800;
    letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 16px;
  }
  .section-sub { font-size: 16px; color: var(--ink2); max-width: 520px; line-height: 1.6; }

  /* ROLES GRID */
  .roles-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
    margin-top: 48px;
  }
  .role-card {
    background: var(--paper); border: 1px solid var(--border);
    border-radius: var(--r2); padding: 28px; cursor: pointer;
    transition: all .2s; position: relative; overflow: hidden;
  }
  .role-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--accent); opacity: 0; transition: .2s;
  }
  .role-card:hover { border-color: var(--accent); box-shadow: 0 4px 24px rgba(26,71,42,.08); }
  .role-card:hover::before { opacity: 1; }
  .role-card.active { border-color: var(--accent); box-shadow: 0 4px 24px rgba(26,71,42,.1); }
  .role-card.active::before { opacity: 1; }
  .role-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 100px; font-size: 11px;
    font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    margin-bottom: 16px;
  }
  .badge-superadmin { background: #e8e0f7; color: #5b21b6; }
  .badge-admin { background: var(--accent-light); color: var(--accent2); }
  .badge-coordinador { background: #fef3c7; color: #b45309; }
  .badge-encuestador { background: #e0f2fe; color: #0369a1; }
  .role-card h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; letter-spacing: -.5px; }
  .role-card p { font-size: 14px; color: var(--ink2); line-height: 1.5; margin-bottom: 16px; }
  .role-perms { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .role-perms li {
    font-size: 13px; color: var(--ink2); display: flex; align-items: flex-start; gap: 8px;
  }
  .role-perms li::before {
    content: '✓'; color: var(--accent2); font-weight: 700;
    font-size: 12px; margin-top: 2px; flex-shrink: 0;
  }

  /* FLOW */
  .flow-section { background: var(--surface); }
  .flow-steps {
    display: flex; gap: 0; margin-top: 48px;
    border: 1px solid var(--border2); border-radius: var(--r2); overflow: hidden;
  }
  .flow-step {
    flex: 1; padding: 28px 24px; background: var(--paper);
    border-right: 1px solid var(--border); position: relative;
    cursor: pointer; transition: all .2s;
  }
  .flow-step:last-child { border-right: none; }
  .flow-step:hover { background: var(--surface); }
  .flow-step.active { background: var(--accent); color: #fff; }
  .flow-step-num {
    font-family: 'Syne', sans-serif; font-size: 11px;
    font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    opacity: .5; margin-bottom: 12px;
  }
  .flow-step h4 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .flow-step p { font-size: 13px; line-height: 1.5; opacity: .75; }
  .flow-step.active .flow-step-num,
  .flow-step.active h4,
  .flow-step.active p { color: #fff; opacity: 1; }
  .flow-step.active p { opacity: .85; }
  .flow-detail {
    margin-top: 24px; padding: 32px;
    background: var(--paper); border: 1px solid var(--border);
    border-radius: var(--r2); min-height: 200px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .flow-detail h3 { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
  .flow-detail p { font-size: 15px; color: var(--ink2); line-height: 1.6; }
  .detail-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip {
    padding: 6px 14px; border-radius: 100px; font-size: 13px; font-weight: 500;
    background: var(--surface); color: var(--ink2); border: 1px solid var(--border);
  }
  .chip.green { background: var(--accent-light); color: var(--accent2); border-color: transparent; }

  /* DASHBOARD MOCKUP */
  .dashboard-section { background: var(--paper); }
  .dashboard-wrap {
    margin-top: 48px; border: 1px solid var(--border2);
    border-radius: var(--r2); overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,.06);
  }
  .dash-topbar {
    background: var(--ink); color: #fff; padding: 14px 20px;
    display: flex; align-items: center; gap: 16px;
    font-size: 13px;
  }
  .dash-topbar .dot { width: 10px; height: 10px; border-radius: 50%; }
  .d-red { background: #ff5f57; }
  .d-yellow { background: #febc2e; }
  .d-green { background: #28c840; }
  .dash-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; margin-left: 8px; }
  .dash-body {
    display: grid; grid-template-columns: 220px 1fr;
    min-height: 520px; background: #f7f7f5;
  }
  .dash-sidebar {
    background: #fff; border-right: 1px solid var(--border);
    padding: 20px 0;
  }
  .sidebar-section { padding: 0 12px; margin-bottom: 24px; }
  .sidebar-label {
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--ink3);
    padding: 0 8px; margin-bottom: 6px;
  }
  .sidebar-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px; border-radius: 7px; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--ink2);
    transition: all .15s;
  }
  .sidebar-item:hover { background: var(--surface); color: var(--ink); }
  .sidebar-item.active { background: var(--accent-light); color: var(--accent); }
  .sidebar-icon { font-size: 16px; }
  .dash-main { padding: 24px; overflow: auto; }
  .dash-kpis {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--r); padding: 16px;
  }
  .kpi-label { font-size: 11px; color: var(--ink3); font-weight: 600; letter-spacing: .3px; margin-bottom: 4px; }
  .kpi-val { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -1px; }
  .kpi-sub { font-size: 11px; color: var(--accent2); margin-top: 2px; }
  .dash-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .dash-card {
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--r); padding: 16px;
  }
  .dash-card-title {
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
    margin-bottom: 14px; color: var(--ink);
  }
  .map-placeholder {
    height: 180px; background: linear-gradient(135deg, #e8f4e8 0%, #d4edda 100%);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    color: var(--ink3); font-size: 13px; position: relative; overflow: hidden;
  }
  .map-dots { position: absolute; inset: 0; }
  .map-dot {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); opacity: .7;
  }
  .map-dot::after {
    content: ''; position: absolute; inset: -4px; border-radius: 50%;
    border: 1.5px solid var(--accent); opacity: .4;
    animation: ping 2s ease-in-out infinite;
  }
  @keyframes ping { 0%,100%{transform:scale(1);opacity:.4} 50%{transform:scale(1.6);opacity:0} }
  .encuestador-list { display: flex; flex-direction: column; gap: 8px; }
  .enc-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px; border-radius: 7px; background: var(--surface);
  }
  .enc-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .enc-info { flex: 1; }
  .enc-name { font-size: 12px; font-weight: 600; }
  .enc-status { font-size: 11px; color: var(--ink3); }
  .enc-count { font-size: 11px; font-weight: 700; color: var(--accent2); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .s-active { background: #22c55e; }
  .s-idle { background: #f59e0b; }

  /* PREGUNTAS PREVIEW */
  .q-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .q-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: var(--surface);
    border-radius: 8px; font-size: 13px;
  }
  .q-type {
    padding: 2px 8px; border-radius: 100px; font-size: 10px;
    font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    flex-shrink: 0;
  }
  .qt-multi { background: #e0f2fe; color: #0369a1; }
  .qt-sino { background: var(--accent-light); color: var(--accent2); }
  .qt-escala { background: #fef3c7; color: #b45309; }
  .qt-texto { background: #f3e8ff; color: #7c3aed; }

  /* PRICING */
  .pricing-section { background: var(--surface); }
  .pricing-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
    margin-top: 48px;
  }
  .plan-card {
    background: var(--paper); border: 1px solid var(--border);
    border-radius: var(--r2); padding: 32px; position: relative;
    transition: all .2s;
  }
  .plan-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,.08); }
  .plan-card.featured {
    background: var(--accent); color: #fff;
    border-color: var(--accent);
    box-shadow: 0 12px 40px rgba(26,71,42,.25);
  }
  .plan-badge {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #fff;
    font-size: 10px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase; padding: 4px 14px; border-radius: 100px;
  }
  .plan-name {
    font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800;
    margin-bottom: 6px;
  }
  .plan-desc { font-size: 13px; opacity: .7; margin-bottom: 24px; }
  .plan-price {
    display: flex; align-items: baseline; gap: 4px; margin-bottom: 4px;
  }
  .plan-price .currency { font-size: 18px; font-weight: 600; margin-top: 6px; }
  .plan-price .amount {
    font-family: 'Syne', sans-serif; font-size: 44px; font-weight: 800;
    letter-spacing: -2px; line-height: 1;
  }
  .plan-price .period { font-size: 13px; opacity: .6; }
  .plan-period-note { font-size: 12px; opacity: .5; margin-bottom: 24px; }
  .plan-divider { border: none; border-top: 1px solid rgba(0,0,0,.08); margin: 20px 0; }
  .plan-card.featured .plan-divider { border-color: rgba(255,255,255,.2); }
  .plan-features { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .plan-features li { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; }
  .plan-features li::before {
    content: '✓'; font-weight: 700; font-size: 12px; margin-top: 2px; flex-shrink: 0;
    color: var(--accent2);
  }
  .plan-card.featured .plan-features li::before { color: #a7f3d0; }
  .plan-features li.muted { opacity: .45; }
  .plan-features li.muted::before { content: '—'; color: inherit; }
  .plan-cta {
    width: 100%; padding: 12px; border-radius: var(--r);
    font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; border: none; transition: all .15s; letter-spacing: .2px;
  }
  .plan-cta-outline {
    background: transparent; color: var(--accent);
    border: 2px solid var(--accent);
  }
  .plan-cta-outline:hover { background: var(--accent-light); }
  .plan-cta-solid {
    background: #fff; color: var(--accent);
  }
  .plan-cta-solid:hover { background: var(--accent-light); }
  .enterprise-card {
    margin-top: 20px; border: 1px solid var(--border);
    border-radius: var(--r2); padding: 32px;
    background: var(--paper); display: flex; align-items: center;
    justify-content: space-between; gap: 24px;
  }
  .enterprise-card h3 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 4px; }
  .enterprise-card p { font-size: 14px; color: var(--ink2); }
  .enterprise-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .e-tag {
    padding: 4px 12px; background: var(--surface); border-radius: 100px;
    font-size: 12px; color: var(--ink2); border: 1px solid var(--border);
  }

  /* MOBILE APP */
  .mobile-section { background: var(--paper); }
  .mobile-grid {
    display: grid; grid-template-columns: 1fr 340px; gap: 60px;
    align-items: center; margin-top: 48px;
  }
  .mobile-features { display: flex; flex-direction: column; gap: 24px; }
  .mobile-feat {
    display: flex; gap: 16px; align-items: flex-start;
  }
  .feat-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--accent-light); display: flex; align-items: center;
    justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .feat-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .feat-desc { font-size: 14px; color: var(--ink2); line-height: 1.5; }
  .phone-frame {
    width: 280px; border-radius: 36px; overflow: hidden;
    border: 8px solid var(--ink); background: #fff;
    box-shadow: 0 24px 60px rgba(0,0,0,.15);
    margin: 0 auto;
  }
  .phone-screen { background: #f7f7f5; min-height: 520px; }
  .phone-statusbar {
    background: var(--ink); color: #fff; padding: 10px 16px;
    font-size: 10px; display: flex; justify-content: space-between;
  }
  .phone-header {
    background: var(--accent); color: #fff; padding: 16px;
  }
  .phone-header h4 { font-size: 15px; font-weight: 700; }
  .phone-header p { font-size: 11px; opacity: .75; margin-top: 2px; }
  .phone-content { padding: 16px; }
  .phone-enc-card {
    background: #fff; border-radius: 10px; padding: 14px;
    margin-bottom: 10px; border: 1px solid var(--border);
  }
  .phone-enc-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .phone-enc-meta { font-size: 11px; color: var(--ink3); margin-bottom: 8px; }
  .phone-progress { height: 4px; background: var(--surface2); border-radius: 2px; }
  .phone-progress-bar { height: 4px; background: var(--accent); border-radius: 2px; }
  .phone-progress-label { font-size: 10px; color: var(--ink3); margin-top: 4px; }
  .phone-btn {
    width: 100%; padding: 10px; background: var(--accent); color: #fff;
    border-radius: 8px; border: none; font-size: 13px; font-weight: 700;
    cursor: pointer; margin-top: 14px;
  }

  /* FAQ / TECH */
  .tech-section { background: var(--surface); }
  .tech-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
    margin-top: 48px;
  }
  .tech-card {
    background: var(--paper); border: 1px solid var(--border);
    border-radius: var(--r2); padding: 24px;
  }
  .tech-card h4 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .tech-card p { font-size: 14px; color: var(--ink2); line-height: 1.6; }
  .tech-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 100px; font-size: 11px;
    font-weight: 600; margin-top: 10px;
    background: var(--accent-light); color: var(--accent2);
  }

  /* FOOTER */
  footer {
    background: var(--ink); color: #fff; padding: 48px 0;
  }
  footer .footer-inner {
    max-width: 1100px; margin: 0 auto; padding: 0 2rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  footer .brand {
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px;
    color: #fff;
  }
  footer p { font-size: 13px; color: rgba(255,255,255,.4); margin-top: 4px; }
  .footer-contact { text-align: right; }
  .footer-email { color: var(--accent-light); font-size: 15px; font-weight: 500; }

  /* ACTIVE CHART CANVAS */
  .chart-wrap { position: relative; height: 180px; }

  /* TRANSITIONS */
  .fade-in { animation: fadeIn .4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (max-width: 768px) {
    .roles-grid { grid-template-columns: 1fr; }
    .pricing-grid { grid-template-columns: 1fr; }

function BarChart({ canvasId, data, labels, color }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const ctx = ref.current.getContext('2d');
    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data,
          backgroundColor: color || '#1a472a',
          borderRadius: 5,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
          y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { font: { size: 11 } } }
        }
      }
    });
    return () => chart.destroy();
  }, []);
  return React.createElement('canvas', { ref });
}

function DonutChart() {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const ctx = ref.current.getContext('2d');
    const chart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Muy satisfecho', 'Satisfecho', 'Regular', 'Insatisfecho'],
        datasets: [{ data: [38, 29, 21, 12], backgroundColor: ['#1a472a', '#2d6a4f', '#52b788', '#b7e4c7'], borderWidth: 0 }]

        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 10, padding: 12 } } }

  }, []);

}

function App() {
  const [activeSection, setActiveSection] = useState('inicio');
  useEffect(() => {
    const handler = () => {
      const sections = SECTIONS.map(s => document.getElementById(s.id)).filter(Boolean);
      const scrollY = window.scrollY + 100;
      let current = 'inicio';
      sections.forEach(el => { if (el.offsetTop <= scrollY) current = el.id; });
      setActiveSection(current);
    };
    window.addEventListener('scroll', handler, { passive: true });
    return () => window.removeEventListener('scroll', handler);
  }, []);

  return React.createElement('div', null,
    React.createElement(Nav, { active: activeSection, onNav: setActiveSection }),
    React.createElement(Hero),
    React.createElement(Roles),
    React.createElement(Flujo),
    React.createElement(Dashboard),
    React.createElement(MobileApp),
    React.createElement(Pricing),
    React.createElement(Tech),
    React.createElement(Footer)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
