<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f0f0f;--ink2:#3a3a3a;--ink3:#888;
  --paper:#fafaf8;--surface:#f2f1ee;--surface2:#e8e6e1;
  --accent:#1a472a;--accent2:#2d6a4f;--accent-light:#d8f3dc;
  --gold:#b5870a;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --r:10px;--r2:16px;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.6}
h1,h2,h3,h4{font-family:'Syne',sans-serif}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,250,248,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;height:56px}
.nav-brand{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--accent);margin-right:auto;letter-spacing:-.3px}
.nav-brand span{color:var(--ink3);font-weight:400}
.nav-tabs{display:flex;gap:2px}
.nav-tab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink3);border:none;background:none;transition:all .15s;font-family:'DM Sans',sans-serif}
.nav-tab:hover{background:var(--surface);color:var(--ink)}
.nav-tab.active{background:var(--accent);color:#fff}

/* LAYOUT */
.section{min-height:100vh;padding:80px 0 60px}
.container{max-width:1100px;margin:0 auto;padding:0 2rem}

/* HERO */
.hero{padding:120px 0 80px;min-height:unset}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--accent-light);color:var(--accent2);font-size:12px;font-weight:600;letter-spacing:.5px;padding:4px 12px;border-radius:100px;text-transform:uppercase;margin-bottom:24px}
.hero-eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.hero h1{font-size:clamp(36px,5vw,64px);font-weight:800;line-height:1.08;letter-spacing:-2px;max-width:700px;margin-bottom:24px}
.hero h1 em{color:var(--accent2);font-style:normal}
.hero-sub{font-size:18px;color:var(--ink2);max-width:520px;line-height:1.6;margin-bottom:40px}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:'DM Sans',sans-serif}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--border2)}
.btn-outline:hover{background:var(--surface)}
.btn-sm{padding:7px 14px;font-size:12px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-top:64px}
.stat-box{background:var(--paper);padding:28px 24px;display:flex;flex-direction:column;gap:4px}
.stat-num{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--accent);letter-spacing:-1px}
.stat-label{font-size:13px;color:var(--ink3)}

/* SHARED SECTION HEADERS */
.sec-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent2);margin-bottom:12px}
.sec-title{font-size:clamp(28px,3.5vw,44px);font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-bottom:16px}
.sec-sub{font-size:16px;color:var(--ink2);max-width:520px;line-height:1.6}

/* ROLES */
.roles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.role-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r2);padding:28px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.role-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);opacity:0;transition:.2s}
.role-card:hover,.role-card.active{border-color:var(--accent);box-shadow:0 4px 24px rgba(26,71,42,.1)}
.role-card:hover::before,.role-card.active::before{opacity:1}
.role-badge{display:inline-flex;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:16px}
.badge-admin{background:var(--accent-light);color:var(--accent2)}
.badge-coordinador{background:#fef3c7;color:#b45309}
.badge-encuestador{background:#e0f2fe;color:#0369a1}
.role-card h3{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-.5px}
.role-card p{font-size:14px;color:var(--ink2);line-height:1.5;margin-bottom:16px}
.role-perms{list-style:none;display:flex;flex-direction:column;gap:6px}
.role-perms li{font-size:13px;color:var(--ink2);display:flex;align-items:flex-start;gap:8px}
.role-perms li::before{content:"✓";color:var(--accent2);font-weight:700;font-size:12px;margin-top:2px;flex-shrink:0}

/* FLOW */
.flow-section{background:var(--surface)}
.flow-steps{display:flex;margin-top:48px;border:1px solid var(--border2);border-radius:var(--r2);overflow:hidden}
.flow-step{flex:1;padding:24px 20px;background:var(--paper);border-right:1px solid var(--border);cursor:pointer;transition:all .2s}
.flow-step:last-child{border-right:none}
.flow-step:hover{background:var(--surface)}
.flow-step.active{background:var(--accent)}
.flow-step-num{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.5;margin-bottom:10px;color:var(--ink)}
.flow-step h4{font-size:14px;font-weight:700;color:var(--ink);line-height:1.3}
.flow-step.active .flow-step-num,.flow-step.active h4{color:#fff;opacity:1}
.flow-detail{margin-top:20px;padding:28px 32px;background:var(--paper);border:1px solid var(--border);border-radius:var(--r2);display:flex;flex-direction:column;gap:14px}
.flow-detail h3{font-size:20px;font-weight:700;letter-spacing:-.5px}
.flow-detail p{font-size:15px;color:var(--ink2);line-height:1.6}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:100px;font-size:13px;font-weight:500;background:var(--accent-light);color:var(--accent2)}

/* DASHBOARD */
.dash-section{background:var(--paper)}
.dash-wrap{margin-top:48px;border:1px solid var(--border2);border-radius:var(--r2);overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.06)}
.dash-topbar{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:8px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%}
.d-r{background:#ff5f57}.d-y{background:#febc2e}.d-g{background:#28c840}
.dash-title{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;margin-left:8px}
.dash-body{display:grid;grid-template-columns:220px 1fr;min-height:540px;background:#f7f7f5}
.dash-sidebar{background:#fff;border-right:1px solid var(--border);padding:20px 0}
.sb-section{padding:0 12px;margin-bottom:24px}
.sb-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);padding:0 8px;margin-bottom:6px}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink2);transition:all .15s;user-select:none}
.sb-item:hover{background:var(--surface);color:var(--ink)}
.sb-item.active{background:var(--accent-light);color:var(--accent)}
.sb-icon{font-size:15px}
.dash-main{padding:24px;overflow:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px}
.kpi-l{font-size:10px;color:var(--ink3);font-weight:600;letter-spacing:.3px;margin-bottom:4px}
.kpi-v{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;letter-spacing:-1px}
.kpi-s{font-size:11px;color:var(--accent2);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.dash-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px}
.dash-card-t{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:12px;color:var(--ink)}
.chart-wrap{position:relative;height:175px}
.enc-list{display:flex;flex-direction:column;gap:7px}
.enc-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:7px;background:var(--surface)}
.enc-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.enc-name{font-size:12px;font-weight:600}
.enc-zone{font-size:11px;color:var(--ink3)}
.enc-cnt{font-size:11px;font-weight:700;color:var(--accent2)}
.sdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:3px}
.s-on{background:#22c55e}.s-off{background:#f59e0b}
.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:12px;cursor:pointer;transition:all .15s}
.item-card:hover{border-color:var(--accent)}
.item-card-t{font-size:13px;font-weight:700;margin-bottom:3px}
.item-card-s{font-size:12px;color:var(--ink3)}
.item-card-m{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700;text-transform:uppercase}
.tg{background:var(--accent-light);color:var(--accent2)}
.tb{background:#e0f2fe;color:#0369a1}
.tgr{background:var(--surface2);color:var(--ink3)}
.rep-row{display:flex;align-items:center;gap:12px;padding:10px;background:var(--surface);border-radius:8px;margin-bottom:8px}
.rep-icon{font-size:18px;flex-shrink:0}
.rep-t{font-size:13px;font-weight:600}
.rep-s{font-size:11px;color:var(--ink3);margin-top:2px}
.rep-btn{padding:5px 12px;border-radius:6px;background:var(--accent-light);color:var(--accent2);border:none;font-size:11px;font-weight:700;cursor:pointer}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:13px;background:var(--surface);border-radius:8px;margin-bottom:7px}
.cfg-l{font-size:13px;font-weight:600}
.cfg-s{font-size:12px;color:var(--ink3)}
.toggle{width:34px;height:18px;border-radius:9px;flex-shrink:0;position:relative;background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;right:2px;width:14px;height:14px;background:#fff;border-radius:50%}
.toggle.off{background:var(--surface2)}
.toggle.off::after{right:unset;left:2px}

/* PRICING */
.pricing-section{background:var(--surface)}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
.plan-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r2);padding:32px;position:relative;transition:all .2s}
.plan-card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.08)}
.plan-card.featured{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 12px 40px rgba(26,71,42,.25)}
.plan-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 14px;border-radius:100px;white-space:nowrap}
.plan-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:6px}
.plan-desc{font-size:13px;opacity:.7;margin-bottom:22px}
.plan-price{display:flex;align-items:baseline;gap:4px;margin-bottom:4px}
.plan-currency{font-size:18px;font-weight:600;margin-top:5px}
.plan-amount{font-family:'Syne',sans-serif;font-size:40px;font-weight:800;letter-spacing:-2px;line-height:1}
.plan-period{font-size:13px;opacity:.6}
.plan-note{font-size:12px;opacity:.5;margin-bottom:22px}
.plan-hr{border:none;border-top:1px solid rgba(0,0,0,.08);margin:18px 0}
.plan-card.featured .plan-hr{border-color:rgba(255,255,255,.2)}
.plan-features{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.plan-features li{display:flex;align-items:flex-start;gap:9px;font-size:14px}
.plan-features li::before{content:"✓";font-weight:700;font-size:12px;margin-top:2px;flex-shrink:0;color:var(--accent2)}
.plan-card.featured .plan-features li::before{color:#a7f3d0}
.plan-features li.muted{opacity:.4}
.plan-features li.muted::before{content:"—";color:inherit}
.plan-cta{width:100%;padding:12px;border-radius:var(--r);font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.cta-outline{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.cta-outline:hover{background:var(--accent-light)}
.cta-solid{background:#fff;color:var(--accent)}
.cta-solid:hover{background:var(--accent-light)}
.ent-card{margin-top:20px;border:1px solid var(--border);border-radius:var(--r2);padding:32px;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:24px}
.ent-card h3{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.ent-card p{font-size:14px;color:var(--ink2)}
.ent-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.etag{padding:4px 12px;background:var(--surface);border-radius:100px;font-size:12px;color:var(--ink2);border:1px solid var(--border)}

/* MOBILE APP SECTION */
.mobile-section{background:var(--paper)}
.mobile-grid{display:grid;grid-template-columns:1fr 280px;gap:60px;align-items:start;margin-top:48px}
.mob-feats{display:flex;flex-direction:column;gap:22px}
.mob-feat{display:flex;gap:16px;align-items:flex-start}
.feat-icon{width:40px;height:40px;border-radius:10px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.feat-t{font-size:16px;font-weight:700;margin-bottom:4px}
.feat-d{font-size:14px;color:var(--ink2);line-height:1.5}

/* PHONE FRAME */
.phone-frame{width:260px;border-radius:36px;overflow:hidden;border:8px solid var(--ink);background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.18);margin:0 auto;flex-shrink:0}
.phone-statusbar{background:var(--ink);color:#fff;padding:10px 16px;font-size:10px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
/* Screen that slides between views */
.phone-screen{overflow:hidden;position:relative;background:#f7f7f5}

/* HOME SCREEN */
.phone-home-header{background:var(--accent);color:#fff;padding:16px}
.phone-home-header h4{font-size:15px;font-weight:700}
.phone-home-header p{font-size:11px;opacity:.75;margin-top:2px}
.phone-home-body{padding:14px}
.phone-enc-card{background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.phone-enc-card-t{font-size:13px;font-weight:700;margin-bottom:4px}
.phone-enc-card-m{font-size:11px;color:var(--ink3);margin-bottom:8px}
.phone-prog{height:4px;background:var(--surface2);border-radius:2px}
.phone-prog-b{height:4px;background:var(--accent);border-radius:2px;transition:width .3s}
.phone-prog-l{font-size:10px;color:var(--ink3);margin-top:4px}
.phone-action-btn{width:100%;padding:10px;color:#fff;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;margin-top:12px;transition:all .15s}
.phone-action-btn:hover{opacity:.9}

/* SURVEY SCREEN (inside phone) */
.phone-survey{display:flex;flex-direction:column;height:100%;background:#fff}
.phone-sv-header{background:var(--accent);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.phone-sv-back{background:rgba(255,255,255,.2);border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phone-sv-title{font-size:13px;font-weight:700;flex:1}
.phone-sv-prog{height:3px;background:rgba(255,255,255,.25);flex-shrink:0}
.phone-sv-prog-b{height:3px;background:#fff;transition:width .4s ease}
.phone-sv-body{flex:1;padding:20px 16px;overflow-y:auto;display:flex;flex-direction:column}
.phone-sv-qnum{font-size:10px;font-weight:700;color:var(--accent2);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.phone-sv-qtext{font-size:15px;font-weight:700;line-height:1.35;letter-spacing:-.3px;margin-bottom:18px;font-family:'Syne',sans-serif}
.phone-sv-opts{display:flex;flex-direction:column;gap:8px;flex:1}
.phone-sv-opt{padding:10px 12px;border:1.5px solid var(--border2);border-radius:9px;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;background:#fff;text-align:left;display:flex;align-items:center;gap:8px}
.phone-sv-opt:hover{border-color:var(--accent);background:var(--accent-light)}
.phone-sv-opt.sel{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.phone-sv-opt-k{width:20px;height:20px;border-radius:5px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.phone-sv-opt.sel .phone-sv-opt-k{background:var(--accent);color:#fff}
.phone-sv-scale{display:flex;flex-direction:column;gap:10px;flex:1;justify-content:center}
.phone-sv-scale-row{display:flex;gap:5px;justify-content:center}
.phone-sv-scale-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3)}
.phone-scale-btn{width:36px;height:36px;border-radius:7px;border:1.5px solid var(--border2);background:#fff;cursor:pointer;font-size:12px;font-weight:700;transition:all .15s}
.phone-scale-btn:hover{border-color:var(--accent);background:var(--accent-light)}
.phone-scale-btn.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.phone-sv-textarea{width:100%;padding:10px;border:1.5px solid var(--border2);border-radius:9px;font-size:12px;font-family:'DM Sans',sans-serif;resize:none;outline:none;flex:1;min-height:80px}
.phone-sv-textarea:focus{border-color:var(--accent)}
.phone-sv-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.phone-sv-nav-btn{flex:1;padding:10px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;transition:all .15s}
.phone-sv-prev{background:var(--surface);color:var(--ink2)}
.phone-sv-nxt{background:var(--accent);color:#fff}
.phone-sv-nxt:disabled{opacity:.35;cursor:not-allowed}
/* Done screen */
.phone-sv-done{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;padding:24px;gap:10px}
.phone-sv-done-icon{font-size:40px}
.phone-sv-done h4{font-size:17px;font-weight:800;font-family:'Syne',sans-serif;letter-spacing:-.3px}
.phone-sv-done p{font-size:12px;color:var(--ink2)}

/* TECH */
.tech-section{background:var(--surface)}
.tech-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:48px}
.tech-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r2);padding:24px}
.tech-card h4{font-size:16px;font-weight:700;margin-bottom:8px}
.tech-card p{font-size:14px;color:var(--ink2);line-height:1.6}
.tech-tag{display:inline-flex;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;margin-top:10px;background:var(--accent-light);color:var(--accent2)}

/* FOOTER */
footer{background:var(--ink);color:#fff;padding:48px 0}
.footer-inner{max-width:1100px;margin:0 auto;padding:0 2rem;display:flex;justify-content:space-between;align-items:center}
.footer-brand{font-family:'Syne',sans-serif;font-weight:800;font-size:20px}
footer p{font-size:13px;color:rgba(255,255,255,.4);margin-top:4px}
.footer-email{color:#d8f3dc;font-size:15px;font-weight:500}

/* UTILS */
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

@media(max-width:768px){
  .roles-grid,.pricing-grid,.mobile-grid,.tech-grid{grid-template-columns:1fr}
  .dash-body{grid-template-columns:1fr}
  .dash-sidebar{display:none}
  .stats-row,.kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.cards-grid{grid-template-columns:1fr}
  .flow-steps{flex-direction:column}
  .ent-card{flex-direction:column}
}

</style>

<body>
<div id="root"></div>
<script>

const {useState, useEffect, useRef} = React;
const D = JSON.parse(document.getElementById('D').textContent);
const ICONS = {
  dashboard:'\uD83D\uDCCA', mapa:'\uD83D\uDDFA\uFE0F', encuestas:'\uD83D\uDCCB', equipos:'\uD83D\uDC65', enc:'\uD83D\uDC64',
  coord:'\uD83D\uDC54', reportes:'\uD83D\uDCC1', config:'\u2699\uFE0F', chart:'\uD83D\uDCCA', pin:'\uD83D\uDCCD', people:'\uD83D\uDC65',
  list:'\uD83D\uDCCB', trend:'\uD83D\uDCC8', clipboard:'\uD83D\uDCCB', bolt:'\u26A1', offline:'\uD83D\uDCF5',
  lock:'\uD83D\uDD12', phone:'\uD83D\uDCF1'
};

function ce(type, props) {
  const args = [type, props || null];
  for (let i = 2; i < arguments.length; i++) args.push(arguments[i]);
  return React.createElement.apply(React, args);
}

function BarChart({labels, data, color}) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const c = new Chart(ref.current.getContext('2d'), {
      type: 'bar',
      data: {labels, datasets: [{data, backgroundColor: color || '#1a472a', borderRadius: 5, borderSkipped: false}]},
      options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {display: false}},
        scales: {x: {grid: {display: false}, ticks: {font: {size: 10}}}, y: {grid: {color: 'rgba(0,0,0,0.05)'}, ticks: {font: {size: 10}}}}}
    });
    return () => c.destroy();
  }, []);
  return ce('canvas', {ref});
}

function DonutChart() {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const c = new Chart(ref.current.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: ['Muy satisfecho', 'Satisfecho', 'Regular', 'Insatisfecho'],
        datasets: [{data: [38, 29, 21, 12], backgroundColor: ['#1a472a', '#2d6a4f', '#52b788', '#b7e4c7'], borderWidth: 0}]
      },
      options: {responsive: true, maintainAspectRatio: false, cutout: '70%',
        plugins: {legend: {position: 'bottom', labels: {font: {size: 10}, boxWidth: 10, padding: 10}}}}
    });
    return () => c.destroy();
  }, []);
  return ce('canvas', {ref});
}

function MapSVG({full}) {
  const h = full ? 360 : 190;
  const pins = [
    {x: 110, y: 105, name: 'Mar\u00EDa R.', color: '#1a472a', count: '14'},
    {x: 230, y: 190, name: 'Juan L.', color: '#0369a1', count: '9'},
    {x: 320, y: 115, name: 'Ana S.', color: '#b45309', count: '7'},
    {x: 400, y: 245, name: 'Carlos P.', color: '#7c3aed', count: '11'},
    {x: 495, y: 148, name: 'Laura M.', color: '#c0392b', count: '6'}
  ];
  const buildings = [{x:25,y:45,w:85,h:42},{x:125,y:175,w:95,h:52},{x:245,y:65,w:75,h:38},{x:315,y:195,w:88,h:48},{x:425,y:75,w:105,h:46},{x:445,y:260,w:72,h:52}];
  return ce('div', {style: {borderRadius: 8, overflow: 'hidden', height: h, position: 'relative', background: '#deefd8'}},
    ce('svg', {width: '100%', height: '100%', viewBox: '0 0 600 360', preserveAspectRatio: 'xMidYMid slice'},
      ce('rect', {width: 600, height: 360, fill: '#deefd8'}),
      ce('path', {d: 'M0 160 Q150 122 300 160 Q450 198 600 160', stroke: '#a8d5a2', strokeWidth: 3, fill: 'none'}),
      ce('path', {d: 'M0 240 Q100 212 200 240 Q300 268 400 240 Q500 220 600 240', stroke: '#a8d5a2', strokeWidth: 2, fill: 'none'}),
      ce('path', {d: 'M190 0 L190 360', stroke: '#a8d5a2', strokeWidth: 2, fill: 'none'}),
      ce('path', {d: 'M400 0 L400 360', stroke: '#a8d5a2', strokeWidth: 2, fill: 'none'}),
      ...buildings.map((b, i) => ce('rect', {key: 'b'+i, ...b, fill: '#c5dbc5', rx: 5})),
      ce('text', {x: 300, y: 348, textAnchor: 'middle', fontSize: 11, fill: '#5a9e5a', fontWeight: 600}, 'Municipio de Posadas'),
      ...pins.map((p, i) => ce('g', {key: 'p'+i},
        ce('circle', {cx: p.x, cy: p.y, r: 14, fill: p.color, opacity: .18}),
        ce('circle', {cx: p.x, cy: p.y, r: 7, fill: p.color, stroke: '#fff', strokeWidth: 2}),
        ce('rect', {x: p.x-28, y: p.y+10, width: 56, height: 28, fill: '#fff', rx: 5, opacity: .95}),
        ce('text', {x: p.x, y: p.y+22, textAnchor: 'middle', fontSize: 9, fill: '#222', fontWeight: 700}, p.name),
        ce('text', {x: p.x, y: p.y+33, textAnchor: 'middle', fontSize: 8, fill: p.color, fontWeight: 600}, p.count + " enc.")
      ))
    )
  );
}

function DashPanel() {
  const [tab, setTab] = useState('dashboard');
  const sidebar = D.dashSidebar;
  const encuestadores = D.encuestadores;

  function renderMain() {
    if (tab === 'dashboard') return ce('div', {className: 'fade-in'},
      ce('div', {className: 'kpis'}, D.kpis.map((k, i) => ce('div', {key: i, className: 'kpi'},
        ce('div', {className: 'kpi-l'}, k.l),
        ce('div', {className: 'kpi-v'}, k.v),
        ce('div', {className: 'kpi-s'}, k.s)
      ))),
      ce('div', {className: 'grid2'},
        ce('div', {className: 'dash-card'}, ce('div', {className: 'dash-card-t'}, 'Respuestas por hora'), ce('div', {className: 'chart-wrap'}, ce(BarChart, {labels: ['8h','9h','10h','11h','12h','13h','14h','15h'], data: [12,34,55,62,48,71,58,63], color: '#1a472a'}))),
        ce('div', {className: 'dash-card'}, ce('div', {className: 'dash-card-t'}, '\u00BFC\u00F3mo calific\u00E1s la gesti\u00F3n?'), ce('div', {className: 'chart-wrap'}, ce(DonutChart)))
      ),
      ce('div', {className: 'grid2'},
        ce('div', {className: 'dash-card'}, ce('div', {className: 'dash-card-t'}, 'Mapa de encuestadores'), ce(MapSVG, {full: false})),
        ce('div', {className: 'dash-card'}, ce('div', {className: 'dash-card-t'}, 'Encuestadores activos'),
          ce('div', {className: 'enc-list'}, encuestadores.map((e, i) => ce('div', {key: i, className: 'enc-row'},
            ce('div', {className: 'enc-av', style: {background: e.bg, color: e.tc}}, e.initials),
            ce('div', {style: {flex: 1}}, ce('div', {className: 'enc-name'}, e.name), ce('div', {className: 'enc-zone'}, ce('span', {className: 'sdot ' + (e.status === 'active' ? 's-on' : 's-off')}), e.zone)),
            ce('div', {className: 'enc-cnt'}, e.count + " enc.")
          )))
        )
      )
    );

    if (tab === 'mapa') return ce('div', {className: 'fade-in'},
      ce('div', {className: 'dash-card'}, ce('div', {className: 'dash-card-t'}, 'Mapa en tiempo real \u2014 Posadas, Misiones'), ce(MapSVG, {full: true}))
    );

    if (tab === 'encuestas') return ce('div', {className: 'fade-in'},
      ce('div', {style: {display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14}},
        ce('span', {style: {fontFamily: 'Syne', fontWeight: 700, fontSize: 15}}, 'Encuestas'),
        ce('button', {className: 'btn btn-primary btn-sm'}, '+ Nueva')
      ),
      ce('div', {className: 'cards-grid'}, D.encuestasCards.map((e, i) => ce('div', {key: i, className: 'item-card'},
        ce('div', {className: 'item-card-t'}, e.name),
        ce('div', {className: 'item-card-s'}, e.p + ' preguntas \u00B7 ' + e.r + ' respuestas'),
        ce('div', {className: 'item-card-m'}, ce('span', {className: 'tag ' + (e.estado === 'activa' ? 'tg' : 'tgr')}, e.estado), ce('span', {className: 'tag tb'}, e.eq + ' equipos'))
      )))
    );

    if (tab === 'equipos') return ce('div', {className: 'fade-in'},
      ce('div', {style: {display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14}},
        ce('span', {style: {fontFamily: 'Syne', fontWeight: 700, fontSize: 15}}, 'Equipos'),
        ce('button', {className: 'btn btn-primary btn-sm'}, '+ Nuevo')
      ),
      ce('div', {className: 'cards-grid'}, D.equiposCards.map((e, i) => ce('div', {key: i, className: 'item-card'},
        ce('div', {className: 'item-card-t'}, e.name),
        ce('div', {style: {fontSize: 11, color: 'var(--ink3)', marginBottom: 8, marginTop: 2}}, 'Coordinador'),
        ce('div', {style: {display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10}},
          ce('div', {style: {display: 'flex', alignItems: 'center', gap: 8}},
            ce('div', {className: 'enc-av', style: {background: e.coordBg, color: e.coordTc, width: 26, height: 26, fontSize: 10, flexShrink: 0}}, e.coordI),
            ce('span', {style: {fontSize: 13, fontWeight: 600}}, e.coord)
          ),
          ce('button', {style: {fontSize: 11, color: 'var(--accent2)', background: 'var(--accent-light)', border: 'none', borderRadius: 6, padding: '3px 8px', cursor: 'pointer', fontWeight: 600}}, 'Cambiar')
        ),
        ce('div', {className: 'item-card-m'}, ce('span', {className: 'tag tb'}, e.enc + ' encuestadores'), ce('span', {className: 'tag tg'}, e.encuestas + ' encuestas'))
      )))
    );

    if (tab === 'coordinadores') return ce('div', {className: 'fade-in'},
      ce('div', {style: {display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14}},
        ce('span', {style: {fontFamily: 'Syne', fontWeight: 700, fontSize: 15}}, 'Coordinadores'),
        ce('button', {className: 'btn btn-primary btn-sm'}, '+ Invitar')
      ),
      ce('div', {style: {fontSize: 13, color: 'var(--ink3)', marginBottom: 14, padding: '10px 14px', background: 'var(--accent-light)', borderRadius: 8, borderLeft: '3px solid var(--accent2)'}},
        'Los coordinadores deben existir en el sistema antes de poder asignarlos a un equipo.'
      ),
      ce('div', {className: 'cards-grid'},
        [
          {i:'RV', name:'Roberto V.', email:'roberto@ejemplo.com', equipos:['Norte'], estado:'Activo', bg:'#e0f2fe', tc:'#0369a1'},
          {i:'SM', name:'Sandra M.', email:'sandra@ejemplo.com', equipos:['Centro'], estado:'Activo', bg:'#d8f3dc', tc:'#1a472a'},
          {i:'DP', name:'Diego P.', email:'diego@ejemplo.com', equipos:['Sur'], estado:'Activo', bg:'#fef3c7', tc:'#b45309'},
          {i:'CR', name:'Claudia R.', email:'claudia@ejemplo.com', equipos:['Este'], estado:'Activo', bg:'#f3e8ff', tc:'#7c3aed'},
          {i:'MF', name:'Mar\u00EDa F.', email:'maria.f@ejemplo.com', equipos:[], estado:'Sin equipo', bg:'#fce7f3', tc:'#be185d'},
        ].map((c, i) => ce('div', {key: i, className: 'item-card', style: {display: 'flex', gap: 10, alignItems: 'flex-start'}},
          ce('div', {className: 'enc-av', style: {background: c.bg, color: c.tc, width: 36, height: 36, fontSize: 13, flexShrink: 0}}, c.i),
          ce('div', {style: {flex: 1, minWidth: 0}},
            ce('div', {className: 'item-card-t'}, c.name),
            ce('div', {className: 'item-card-s'}, c.email),
            ce('div', {className: 'item-card-m'},
              c.equipos.length > 0 ? c.equipos.map((eq, j) => ce('span', {key: j, className: 'tag tb'}, 'Equipo ' + eq)) : ce('span', {className: 'tag tgr'}, 'Sin equipo asignado'),
              ce('span', {className: 'tag ' + (c.estado === 'Activo' ? 'tg' : 'tgr')}, c.estado)
            )
          )
        ))
      )
    );

    if (tab === 'encuestadores') return ce('div', {className: 'fade-in'},
      ce('div', {style: {display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14}},
        ce('span', {style: {fontFamily: 'Syne', fontWeight: 700, fontSize: 15}}, 'Encuestadores'),

function PhoneSurveyScreen({surveyName, onBack}) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [done, setDone] = useState(false);
  const qs = D.surveyQs;
  const q = qs[step];
  const total = qs.length;
  const pct = Math.round(((step + (done ? 1 : 0)) / total) * 100);
  const hasAnswer = answers[step] !== undefined && answers[step] !== '';

  function next() { if (step < total - 1) setStep(s => s + 1); else setDone(true); }
  function back() { if (step > 0) setStep(s => s - 1); }

  function renderQ() {
    if (done) return ce('div', {className: 'phone-sv-done'},
      ce('div', {className: 'phone-sv-done-icon'}, '\u2705'),
      ce('h4', null, '\u00A1Completada!'),
      ce('p', null, 'Respuestas enviadas al panel central.'),
      ce('button', {className: 'phone-action-btn', style: {background: '#1a472a', marginTop: 16}, onClick: onBack}, '\u2190 Volver a encuestas')
    );
    if (q.type === 'multi' || q.type === 'sino') return ce('div', {className: 'phone-sv-opts'},
      q.opts.map((opt, i) => ce('button', {key: i, className: 'phone-sv-opt' + (answers[step] === i ? ' sel' : ''), onClick: () => setAnswers(a => ({...a, [step]: i}))},
        ce('span', {className: 'phone-sv-opt-k'}, String.fromCharCode(65 + i)), opt
      ))
    );
    if (q.type === 'escala') return ce('div', {className: 'phone-sv-scale'},
      ce('div', {className: 'phone-sv-scale-row'}, Array.from({length: 10}, (_, i) => ce('button', {key: i, className: 'phone-scale-btn' + (answers[step] === (i + 1) ? ' sel' : ''), onClick: () => setAnswers(a => ({...a, [step]: i + 1}))}, i + 1))),
      ce('div', {className: 'phone-sv-scale-labels'}, ce('span', null, 'Nada probable'), ce('span', null, 'Muy probable'))
    );
    if (q.type === 'texto') return ce('textarea', {className: 'phone-sv-textarea', rows: 4, placeholder: 'Escrib\u00ED la respuesta...', value: answers[step] || '', onChange: e => setAnswers(a => ({...a, [step]: e.target.value}))});
  }

  return ce('div', {className: 'phone-survey'},
    ce('div', {className: 'phone-sv-header'},
      ce('button', {className: 'phone-sv-back', onClick: onBack}, '\u2190'),
      ce('div', {className: 'phone-sv-title'}, surveyName)
    ),
    ce('div', {className: 'phone-sv-prog'}, ce('div', {className: 'phone-sv-prog-b', style: {width: pct + '%'}})),
    ce('div', {className: 'phone-sv-body'},
      !done && ce('div', {className: 'phone-sv-qnum'}, 'Pregunta ' + (step + 1) + ' de ' + total),
      !done && ce('div', {className: 'phone-sv-qtext'}, q.text),
      renderQ()
    ),
    !done && ce('div', {className: 'phone-sv-footer'},
      ce('button', {className: 'phone-sv-nav-btn phone-sv-prev', onClick: back, style: {visibility: step === 0 ? 'hidden' : 'visible'}}, '\u2190 Atr\u00E1s'),
      ce('button', {className: 'phone-sv-nav-btn phone-sv-nxt', disabled: !hasAnswer, onClick: next}, step === total - 1 ? 'Finalizar' : 'Siguiente \u2192')
    )
  );
}

      ce('div', {className:'roles-grid'},
        D.roles.map(r => ce('div', {key:r.key, className:'role-card'+(active===r.key?' active':''), onClick:()=>setActive(r.key)},
          ce('span', {className:'role-badge '+r.badge}, r.label),
          ce('h3', null, r.title),
          ce('p', null, r.desc),
          ce('ul', {className:'role-perms'}, r.perms.map((p,i)=>ce('li',{key:i},p)))
        ))
      )
    )
  );
}

function Flujo() {
  const [step, setStep] = useState(0);
  return ce('section', {id:'flujo', className:'section flow-section'},
    ce('div', {className:'container'},
      ce('div', {className:'sec-label'}, 'C\u00F3mo funciona'),
      ce('h2', {className:'sec-title'}, 'Del dise\u00F1o al dato\nen 5 pasos'),
      ce('p', {className:'sec-sub'}, 'El flujo completo desde que nosotros armamos la encuesta hasta que los resultados aparecen en el panel.'),
      ce('div', {className:'flow-steps'},
        D.flowSteps.map((s,i)=>ce('div',{key:i,className:'flow-step'+(step===i?' active':''),onClick:()=>setStep(i)},
          ce('div',{className:'flow-step-num'},'0'+(i+1)),ce('h4',null,s.title)
        ))
      ),
      ce('div', {className:'flow-detail fade-in', key:step},
        ce('h3', null, D.flowSteps[step].title),
        ce('p', null, D.flowSteps[step].detail),
        ce('div', {className:'chips'}, D.flowSteps[step].chips.map((c,i)=>ce('span',{key:i,className:'chip'},c)))
      )

}

function Dashboard() {
  return ce('section', {id:'panel', className:'section dash-section'},
    ce('div', {className:'container'},
      ce('div', {className:'sec-label'}, 'Panel central'),
      ce('h2', {className:'sec-title'}, 'Todo el territorio\nen una pantalla'),
      ce('p', {className:'sec-sub'}, 'El admin y el coordinador monitorean en tiempo real cada respuesta, cada encuestador y cada zona del municipio.'),
      ce(DashPanel)
    )

function Pricing() {
  return ce('section', {id:'precios', className:'section pricing-section'},
    ce('div', {className:'container'},
      ce('div', {className:'sec-label'}, 'Planes'),
      ce('h2', {className:'sec-title'}, 'Planes de suscripción\nmensual'),
      ce('p', {className:'sec-sub'}, 'Cada plan incluye una cantidad de encuestas diseñadas por nuestro equipo. Encuestas adicionales tienen un costo extra. El acceso al panel y a la app está activo mientras la suscripción esté paga.'),
      ce('div', {className:'pricing-grid'},
        D.plans.map((plan,i) => ce('div', {key:i, className:'plan-card'+(plan.featured?' featured':'')},
          plan.featured && ce('div', {className:'plan-badge'}, '\u2B50 M\u00C1S POPULAR'),
          ce('div', {className:'plan-name'}, plan.name),
          ce('div', {className:'plan-desc'}, plan.desc),
          ce('div', {className:'plan-price'},
            ce('span', {className:'plan-amount', style:{fontSize:34,letterSpacing:-1,lineHeight:1}}, 'Consultar')
          ),
          ce('div', {className:'plan-note'}, 'Precio a convenir seg\u00FAn municipio'),
          ce('hr', {className:'plan-hr'}),
          ce('ul', {className:'plan-features'},
            plan.features.map((f,j)=>{
              const text = typeof f==='string' ? f : f.text;
              const muted = typeof f==='object' && f.muted;
              return ce('li',{key:j,className:muted?'muted':''},text);
            })
          ),
          ce('button', {className:'plan-cta '+(plan.featured?'cta-solid':'cta-outline')}, 'Consultar precio')
        ))
      ),
      ce('div', {className:'ent-card'},
        ce('div', null,
          ce('h3', null, 'Encuestas adicionales'),
          ce('p', null, '\u00BFNecess\u00EDts m\u00E1s encuestas de las que incluye tu plan? Nosotros las armamos y las agregamos a tu cuenta. Sin cambiar de plan.'),
          ce('div', {className:'ent-tags'},
            ['Armadas por nuestro equipo','Entrega en 48h','Revisiones incluidas','Sin cambiar de plan']
            .map((t,i)=>ce('span',{key:i,className:'etag'},t))
          )
        ),
        ce('button', {className:'btn btn-primary', style:{flexShrink:0}}, 'Consultar')
      )
    )
  );
}

function Tech() {
  return ce('section', {id:'tecnologia', className:'section tech-section'},
    ce('div', {className:'container'},
      ce('div', {className:'sec-label'}, 'Tecnolog\u00EDa'),
      ce('h2', {className:'sec-title'}, 'Construido para\nescalar'),
      ce('p', {className:'sec-sub'}, 'Un solo sistema que funciona para todos los clientes. Cada campa\u00F1a nueva es solo un cliente m\u00E1s, sin trabajo extra de infraestructura.'),
      ce('div', {className:'tech-grid'},
        D.techCards.map((c,i)=>ce('div',{key:i,className:'tech-card'},ce('h4',null,c.title),ce('p',null,c.text),ce('span',{className:'tech-tag'},c.tag)))
      )
    )
  );
}

function Footer() {
  return ce('footer', null,
    ce('div', {className:'footer-inner'},
      ce('div', null, ce('div', {className:'footer-brand'}, 'Encuestas Enfoque'), ce('p', null, 'Sistema de encuestas en tiempo real para campa\u00F1as electorales')),
      ce('div', {style:{textAlign:'right'}}, ce('p', {style:{color:'rgba(255,255,255,.4)',fontSize:'12px',marginBottom:'4px'}}, 'Contacto'), ce('div', {className:'footer-email'}, 'encuestasenfoque@outlook.com'))
    )
  );
}

function App() {
  const [activeSection, setActiveSection] = useState('inicio');
  useEffect(() => {
    const handler = () => {
      const els = D.sections.map(s => document.getElementById(s.id)).filter(Boolean);
      const sy = window.scrollY + 100;
      let cur = 'inicio';
      els.forEach(el => { if (el.offsetTop <= sy) cur = el.id; });
      setActiveSection(cur);
    };
    window.addEventListener('scroll', handler, {passive: true});
    return () => window.removeEventListener('scroll', handler);
  }, []);
  return ce('div', null,
    ce(Nav, {active:activeSection, onNav:setActiveSection}),
    ce(Hero), ce(Roles), ce(Flujo), ce(Dashboard), ce(MobileApp), ce(Pricing), ce(Tech), ce(Footer)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(App));

</script>
</body>
